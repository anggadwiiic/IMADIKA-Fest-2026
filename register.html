<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Akun</title>
    <link href="./output.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/src/upn.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/feather-icons"></script>
  </head>
  <body
    class="bg-surface text-text-primary font-sans antialiased flex items-center justify-center min-h-screen p-6"
  >
    <div
      class="bg-white border border-gray-100 rounded-2xl shadow-lg w-full max-w-md p-8"
    >
      <div class="text-center mb-8">
        <a
          href="index.html"
          class="font-extrabold text-3xl text-primary-dark tracking-tight"
          >FOUNDEX</a
        >
        <p class="text-sm text-gray-500 mt-2">
          Buat akun untuk melaporkan kehilangan atau penemuan barang.
        </p>
      </div>

      <form id="register-form" class="flex flex-col gap-5">
        <div>
          <label class="block text-sm font-semibold mb-2">Nama Lengkap</label>
          <input
            type="text"
            id="reg-name"
            required
            placeholder="Masukkan nama lengkap"
            class="w-full bg-background border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary-dark focus:ring-1 focus:ring-primary-dark transition"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold mb-2">NIM / NIP</label>
          <input
            type="text"
            id="reg-nim"
            required
            placeholder="Masukkan NIM atau NIP"
            class="w-full bg-background border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary-dark focus:ring-1 focus:ring-primary-dark transition"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold mb-2"
            >Email Institusi</label
          >
          <input
            type="email"
            id="reg-email"
            required
            placeholder="email@institusi.ac.id"
            class="w-full bg-background border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary-dark focus:ring-1 focus:ring-primary-dark transition"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold mb-2">Kata Sandi</label>
          <div class="relative">
            <input
              type="password"
              id="reg-password"
              required
              placeholder="Minimal 6 karakter"
              class="w-full bg-background border border-gray-200 rounded-xl px-4 py-3 pr-12 text-sm focus:outline-none focus:border-primary-dark focus:ring-1 focus:ring-primary-dark transition"
            />
            <button
              type="button"
              class="toggle-password absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary-dark focus:outline-none"
              data-target="reg-password"
            >
              <i data-feather="eye" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <div
          id="reg-error"
          class="text-danger text-xs font-semibold hidden"
        ></div>

        <button
          type="submit"
          id="btn-submit"
          class="w-full bg-primary-dark hover:bg-primary-pressed text-white font-semibold py-3.5 rounded-xl transition mt-2 shadow-sm flex justify-center items-center"
        >
          <span>Daftar Sekarang</span>
        </button>
      </form>

      <div class="text-center mt-6 text-sm text-gray-500">
        Sudah punya akun?
        <a
          href="login.html"
          class="text-primary-dark font-semibold hover:underline"
          >Masuk di sini</a
        >
      </div>
    </div>

    <script src="./src/main.js"></script>
    <script>
      feather.replace();
    </script>
  </body>
</html>
