<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - FOUNDEX</title>
    <link href="./output.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/src/upn.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/feather-icons"></script>
  </head>
  <body
    class="bg-surface text-text-primary font-sans antialiased flex items-center justify-center min-h-screen p-6"
  >
    <div
      class="bg-white border border-gray-100 rounded-2xl shadow-lg w-full max-w-md p-8"
    >
      <div class="text-center mb-8">
        <a
          href="index.html"
          class="font-extrabold text-3xl text-primary-dark tracking-tight"
          >FOUNDEX</a
        >
        <p class="text-sm text-gray-500 mt-2">
          Masuk untuk mengelola laporan dan klaim barang Anda.
        </p>
      </div>

      <form id="login-form" class="flex flex-col gap-5">
        <div>
          <label class="block text-sm font-semibold mb-2">Email Kampus</label>
          <input
            type="email"
            id="login-email"
            required
            placeholder="contoh@upnjatim.ac.id"
            class="w-full bg-background border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary-dark focus:ring-1 focus:ring-primary-dark transition"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold mb-2">Kata Sandi</label>
          <input
            type="password"
            id="login-password"
            required
            placeholder="Masukkan kata sandi"
            class="w-full bg-background border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary-dark focus:ring-1 focus:ring-primary-dark transition"
          />
        </div>

        <!-- Area Pesan Error -->
        <div
          id="login-error"
          class="text-danger text-xs font-semibold hidden"
        ></div>

        <button
          type="submit"
          id="btn-login"
          class="w-full bg-primary-dark hover:bg-primary-pressed text-white font-semibold py-3.5 rounded-xl transition mt-2 shadow-sm flex justify-center items-center"
        >
          <span>Masuk</span>
        </button>
      </form>

      <div class="text-center mt-6 text-sm text-gray-500">
        Belum punya akun?
        <a
          href="register.html"
          class="text-primary-dark font-semibold hover:underline"
          >Daftar di sini</a
        >
      </div>
    </div>

    <!-- Script Utama -->
    <script src="./src/main.js"></script>
    <script>
      feather.replace();
    </script>
  </body>
</html>
